<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 – Product Review Form">
    <meta name="author" content="Michael Flores">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:ital@0;1&display=swap" rel="stylesheet">
    <title>WDD 131 – Product Review Form</title>
    <script src="scripts/form.js" defer></script>
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>Product Review</h1>
    </header>
    <!-- Main -->
    <main>
      <div class="form-card">
        <form method="get" action="review.html">
            
          <div class="form-item">
            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
              <option value="" disabled selected>Choose a Product ...</option>
            </select>
          </div>

          <div class="form-item">
            <span class="label-text">Overall Rating</span>
            <div class="rating-group">
              <div class="rating-option">
                <label for="rating1">☆</label>
                <input type="radio" id="rating1" name="rating" value="1" required>
              </div>
              <div class="rating-option">
                <label for="rating2">☆☆</label>
                <input type="radio" id="rating2" name="rating" value="2">
              </div>
              <div class="rating-option">
                <label for="rating3">☆☆☆</label>
                <input type="radio" id="rating3" name="rating" value="3">
              </div>
              <div class="rating-option">
                <label for="rating4">☆☆☆☆</label>
                <input type="radio" id="rating4" name="rating" value="4">
              </div>
              <div class="rating-option">
                <label for="rating5">☆☆☆☆☆</label>
                <input type="radio" id="rating5" name="rating" value="5">
              </div>
            </div>
          </div>

          <div class="form-item">
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>
          </div>

          <fieldset class="form-item no-border">
            <legend>Which features did you find useful in the product? <br><span class="subtitle">(Check all that apply)</span></legend>
            
            <div class="checkbox-container">
              <label class="checkbox-label">
                <input type="checkbox" id="feat-durability" name="features" value="durability">
                Durability
              </label>
              
              <label class="checkbox-label">
                <input type="checkbox" id="feat-ease" name="features" value="easeOfUse">
                Ease of Use
              </label>
              
              <label class="checkbox-label">
                <input type="checkbox" id="feat-performance" name="features" value="performance">
                Performance
              </label>
              
              <label class="checkbox-label">
                <input type="checkbox" id="feat-design" name="features" value="design">
                Design
              </label>
            </div>
          </fieldset>

          <div class="form-item">
            <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>
          </div>

          <div class="form-item">
            <label for="userName">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="userName" name="userName">
          </div>

          <input type="submit" value="Post Review" class="submit-btn">
        </form>
      </div>
    </main>
    <!-- Footer -->
    <footer>
      <p>&copy; <span id="currentYear"></span> 🌸 Michael Flores 🌸 Utah</p>
      <p class="last-modified">Last Modification: <span id="lastModified"></span></p>
    </footer>
  </body>
</html>
