<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 – Product Review Form">

    <link rel="stylesheet" href="styles/form.css">

    <!-- Header -->

      <h1>Product Review</h1>

    <!-- Main -->
    <main>

      </div>
    </main>
    <!-- Footer -->
    <footer>
      <p>&copy; <span id="currentYear"></span> 🌸 Michael Flores 🌸 Utah</p>
